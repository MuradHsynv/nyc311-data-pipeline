services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data # named volume: data survives restarts
    ports:
      - '5432:5432'
    healthcheck:
      # other services wait for this to pass
      test: [ 'CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}' ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  pipeline:
    # one-off runs: docker compose run --rm pipeline ...
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy # wait for the database healthcheck
    command: python -m pipeline.cli --mode incremental
    profiles: [ 'manual' ] # not started by a plain `docker compose up`

volumes:
  pgdata:
